<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tarif Ekle-Tatlı Lezzetler</title>
    <link rel="stylesheet" href="css/stil.css">
</head>
<body>
    <header>
        <img src="img/logo2.png" alt="Tatlı Lezzetler Logo" width="80">
        <h1>Tatlı Lezzetler</h1>
        <nav>
            <ul>
                <li><a href="index.html">Ana Sayfa</a></li>
                <li><a href="tarifler.html">Tarif Listesi</a></li>
                <li><a href="tarif-ekle.html">Tarif Ekle</a></li>
                <li><a href="hakkimda.html">Hakkımda</a></li>
                <li><a href="olculer.html">Ölçü Karşılıkları</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section id="tarif-formu">
            <h2>Yeni Tarif Ekle</h2>
            <form id="tariFormu">
                <p>
                    <label for="tarifAdi">Tarif Adı:</label>
                    <input type="text" id="tarifAdi" name="tarifAdi" placeholder="Örn. Sütlaç" required>
                </p>
                <p>
                    <label for="sure">Hazırlama Süresi (dk):</label>
                    <input type="number" id="sure" name="sure" min="1" max="300" required>
                </p>
                <p>
                    Zorluk:
                    <br>
                    <input type="radio" id="kolay" name="zorluk" value="Kolay" checked>
                    <label for="kolay">Kolay</label>
                    <input type="radio" id="orta" name="zorluk" value="Orta">
                    <label for="orta">Orta</label>
                    <input type="radio" id="zor" name="zorluk" value="Zor">
                    <label for="zor">Zor</label>
                </p>
                <p>
                    <label for="kategori">Kategori:</label><br>
                    <select id="kategori" name="kategori">
                        <option value="">Sütlü Tatlı</option>
                        <option value="Kek">Şerbetli Tatlı</option>
                        <option value="Kurabiye">Kurabiye</option>
                    </select>
                </p>
                <p>
                    <label for="malzemeler">Malzemeler:</label><br>
                    <textarea id="malzemeler" name="malzemeler" rows="4" cols="40"></textarea>
                </p>
                <p>
                    <label for="yapilisi">Yapılışı:</label><br>
                    <textarea id="yapilisi" name="yapilisi" rows="4" cols="40"></textarea>
                </p>
                <button type="submit">Tarifi Ekle</button>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Tatlı Lezzetler &middot; BLM2537</p>
    </footer>
</body>
</html>
